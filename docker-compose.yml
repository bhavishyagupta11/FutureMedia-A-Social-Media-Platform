version: '3.8'
services:
  server:
    build: ./server
    ports: ["5000:5000"]
    depends_on: [redis, mongodb]
    environment:
      - REDIS_URL=redis://redis:6379
      - MONGO_URI=mongodb://mongodb:27017/FutureMedia
  intelligence:
    build: ./intelligence
    ports: ["8000:8000"]
  social:
    build: ./social
    ports: ["3000:80"]
  redis:
    image: redis:alpine
    ports: ["6379:6379"]
  mongodb:
    image: mongo:6
    ports: ["27017:27017"]
