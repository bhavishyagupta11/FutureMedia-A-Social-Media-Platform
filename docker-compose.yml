services:
  mongodb:
    image: mongo:6
    container_name: futuremedia-mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=futuremedia
    volumes:
      - futuremedia_mongodb_data:/data/db
    networks:
      - futuremedia-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval \"db.adminCommand('ping')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: futuremedia-backend:1.0.0
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: futuremedia-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - path: ./server/.env
        required: false
      - path: ./.env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=8080
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/futuremedia}
      - JWT_SECRET=${JWT_SECRET:-futuremedia_jwt_secret_prod_key_change_me_in_prod}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:3000}
      - CLIENT_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://frontend:80
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - futuremedia-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    image: futuremedia-frontend:1.0.0
    build:
      context: ./social
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_BASE_URL=http://localhost:8080
        - REACT_APP_SOCKET_URL=http://localhost:8080
    container_name: futuremedia-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - futuremedia-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  futuremedia_mongodb_data:
    name: futuremedia_mongodb_data

networks:
  futuremedia-network:
    name: futuremedia-network
    driver: bridge
